name: 功能建议 / Feature request
description: 描述一个真实使用场景或工作流改进。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？ / Problem
      description: 说明当前工作流哪里受阻，而不只是列出按钮名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与参考 / Alternatives and references
      description: 可以提供公开链接，不要附带未经授权的商业模板或私人素材。
